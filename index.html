<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="キャリアバイト｜アルバイトで稼ぎながら、将来の仕事を体験する。架空データによるサービスデモです。">
  <title>キャリアバイト | 稼ぐ時間が、将来につながる。</title>
  <link rel="stylesheet" href="./assets/style.css">
  <script defer src="./assets/mock-data.js"></script>
  <script defer src="./assets/app.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="topbar wrap">
      <button class="brand" type="button" data-action="home" aria-label="キャリアバイト ホーム">
        <span class="brand-mark" aria-hidden="true">c<span>.</span></span>
        <span class="brand-type">キャリアバイト<small>CAREER BAITO</small></span>
      </button>
      <div class="header-right">
        <span class="demo-label">CONCEPT DEMO <span class="demo-dot"></span> 架空データ</span>
        <div class="role-switch" role="group" aria-label="画面を切り替え">
          <button type="button" data-action="role" data-role="student" class="selected">学生向け</button>
          <button type="button" data-action="role" data-role="company">企業向け</button>
        </div>
      </div>
    </div>
  </header>
  <div class="app-layout wrap">
    <aside class="sidebar" aria-label="メインメニュー">
      <p class="sidebar-label" id="side-label">FOR STUDENTS</p>
      <nav class="side-nav" id="side-nav" aria-label="ページ"></nav>
      <div class="side-bottom">
        <div class="sidebar-guide">
          <span class="guide-glyph">✳</span>
          <strong>働くことが、未来を選ぶヒントに。</strong>
          <p>求人、応募、育成はすべてサンプルです。</p>
        </div>
        <button type="button" class="text-button reset-button" data-action="reset">デモデータを初期化</button>
      </div>
    </aside>
    <main id="page" class="main-content" tabindex="-1" aria-live="polite"></main>
  </div>
  <div class="mobile-nav" id="mobile-nav" aria-label="ページ切り替え"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="modal-backdrop" id="modal" hidden></div>
  <footer class="site-footer wrap">
    <span>career baito — 未来につながる、はじめての仕事。</span>
    <span>企画検証用モック / 実在の企業・求人・応募ではありません</span>
  </footer>
</body>
</html>
